[project]
name = "data-engineering"
version = "0.1.0"
description = "Shared code, experiments, and data pipelines."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.113.0",
    "dash>=4.4.0",
    "matplotlib>=3.11.0",
    "pandas",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "umap-learn>=0.5.12",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.1.0",
    "kaggle>=2.2.1",
    "pytest>=8",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_engineering"]
